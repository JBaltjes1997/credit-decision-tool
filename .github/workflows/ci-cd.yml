name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20k

      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Build & Push Docker Images
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: JBaltjes1997
          password: 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

      - name: Build & Push Frontend
        run: |
          docker build -t ghcr.io/OWNER/frontend:latest ./frontend
          docker push ghcr.io/OWNER/frontend:latest

      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/OWNER/backend:latest ./backend
          docker push ghcr.io/OWNER/backend:latest
